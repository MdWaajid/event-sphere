<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registrations — EventSphere Admin</title>
  <meta name="description" content="Admin view of all event registrations on EventSphere."/>
  <link rel="stylesheet" href="../../assets/css/styles.css"/>
</head>
<body>
<div class="admin-layout">

  <!-- Sidebar -->
  <aside class="admin-sidebar">
    <div class="sidebar-logo"><div class="logo-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="4" r="1.6" fill="currentColor" stroke="none"/><circle cx="19.5" cy="16" r="1.6" fill="currentColor" stroke="none"/><circle cx="4.5" cy="16" r="1.6" fill="currentColor" stroke="none"/><path d="M12 8v-2.4M14.6 13.5l4.4 1.6M9.4 13.5l-4.4 1.6"/></svg></div><span>EventSphere</span></div>
    <nav class="sidebar-nav">
      <div class="sidebar-section-label">Main</div>
      <a href="dashboard.html" class="sidebar-link"><span class="sidebar-icon icon"><svg viewBox="0 0 24 24"><path d="M4 20V10M12 20V4M20 20v-7"/></svg></span> Dashboard</a>
      <a href="events.html" class="sidebar-link"><span class="sidebar-icon icon"><svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M16 2.5v4M8 2.5v4M3 9.5h18"/></svg></span> Manage Events</a>
      <a href="registrations.html" class="sidebar-link active"><span class="sidebar-icon icon"><svg viewBox="0 0 24 24"><path d="M3 8.5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v1.7a1.7 1.7 0 0 0 0 3.6v1.7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1.7a1.7 1.7 0 0 0 0-3.6z"/><path d="M12 6.5v11" stroke-dasharray="2 2"/></svg></span> Registrations</a>
      <div class="sidebar-section-label">Settings</div>
      <a href="admins.html" class="sidebar-link"><span class="sidebar-icon icon"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/></svg></span> Manage Admins</a>
      <div class="sidebar-section-label">Navigation</div>
      <a href="../../index.html" class="sidebar-link"><span class="sidebar-icon icon"><svg viewBox="0 0 24 24"><path d="M3.5 11L12 4l8.5 7"/><path d="M5.5 9.5V20h13V9.5"/></svg></span> Back to Site</a>
    </nav>
    <div class="sidebar-user">
      <div class="sidebar-user-info">
        <div class="sidebar-avatar" id="sidebar-avatar">A</div>
        <div>
          <div class="sidebar-user-name" id="sidebar-user-name">Administrator</div>
          <div class="sidebar-user-role" id="sidebar-user-role">ADMIN</div>
        </div>
      </div>
      <button class="btn btn-secondary btn-sm btn-full" style="margin-top:12px;" onclick="Auth.logout('../../index.html')">Logout</button>
    </div>
  </aside>

  <!-- Main -->
  <main class="admin-main">
    <div class="admin-topbar">
      <div class="admin-page-title" style="display:flex;align-items:center;gap:10px;"><span class="icon icon-md"><svg viewBox="0 0 24 24"><path d="M3 8.5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v1.7a1.7 1.7 0 0 0 0 3.6v1.7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1.7a1.7 1.7 0 0 0 0-3.6z"/><path d="M12 6.5v11" stroke-dasharray="2 2"/></svg></span> All Registrations</div>
      <div style="font-size:0.82rem;color:var(--text-muted);" id="total-count"></div>
    </div>

    <div class="admin-content fade-in">
      <!-- Stats -->
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px;">
        <div class="stat-card"><div class="stat-icon cyan icon icon-md"><svg viewBox="0 0 24 24"><path d="M3 8.5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v1.7a1.7 1.7 0 0 0 0 3.6v1.7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1.7a1.7 1.7 0 0 0 0-3.6z"/><path d="M12 6.5v11" stroke-dasharray="2 2"/></svg></div><div><div class="stat-value" id="s-total">—</div><div class="stat-label">Total</div></div></div>
        <div class="stat-card"><div class="stat-icon green icon icon-md"><svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M16 2.5v4M8 2.5v4M3 9.5h18"/></svg></div><div><div class="stat-value" id="s-upcoming">—</div><div class="stat-label">Upcoming</div></div></div>
        <div class="stat-card"><div class="stat-icon purple icon icon-md"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.3 2.3L15.5 9.5"/></svg></div><div><div class="stat-value" id="s-past">—</div><div class="stat-label">Past</div></div></div>
      </div>

      <!-- Filters -->
      <div class="filter-bar" style="margin-bottom:20px;">
        <div class="filter-search">
          <span class="search-icon icon icon-sm"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20.5 20.5l-4.3-4.3"/></svg></span>
          <input type="text" id="search-input" placeholder="Search by user or event…"/>
        </div>
        <select id="event-filter" class="form-control" style="width:auto;padding:8px 12px;font-size:0.85rem;">
          <option value="">All Events</option>
        </select>
        <select id="status-filter" class="form-control" style="width:auto;padding:8px 12px;font-size:0.85rem;">
          <option value="">All</option>
          <option value="upcoming">Upcoming</option>
          <option value="past">Past</option>
        </select>
      </div>

      <!-- Table -->
      <div class="table-wrapper">
        <table class="data-table">
          <thead><tr>
            <th>#</th><th>User</th><th>Email</th><th>Event</th><th>Event Date</th><th>Category</th><th>Registered On</th>
          </tr></thead>
          <tbody id="regs-tbody">
            <tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text-faint);">Loading…</td></tr>
          </tbody>
        </table>
      </div>
      <div id="no-results" class="empty-state hidden">
        <div class="empty-icon icon icon-xl"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20.5 20.5l-4.3-4.3"/></svg></div>
        <div class="empty-title">No registrations found</div>
        <div class="empty-desc">Try adjusting your search or filter.</div>
      </div>
    </div>
  </main>
</div>

<div id="toast-container" class="toast-container"></div>

<script src="../../assets/js/icons.js"></script>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/auth.js"></script>
<script>
let allRegs = [];

document.addEventListener('DOMContentLoaded', async () => {
  if (!Auth.requireAdmin('../../pages/login.html')) return;
  Auth.updateSidebar();

  try {
    allRegs = await API.getAllRegistrations();
    if (!Array.isArray(allRegs)) allRegs = [];

    // Populate event filter
    const eventNames = [...new Set(allRegs.map(r => r.eventTitle))];
    const eventFilter = document.getElementById('event-filter');
    eventNames.forEach(n => {
      const opt = document.createElement('option'); opt.value = n; opt.textContent = n;
      eventFilter.appendChild(opt);
    });

    renderStats();
    renderTable();
  } catch {
    document.getElementById('regs-tbody').innerHTML =
      '<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--danger);">Failed to load registrations.</td></tr>';
  }

  document.getElementById('search-input').addEventListener('input', renderTable);
  document.getElementById('event-filter').addEventListener('change', renderTable);
  document.getElementById('status-filter').addEventListener('change', renderTable);
});

function renderStats() {
  const upcoming = allRegs.filter(r => !isEventPast(r.eventDate)).length;
  const past     = allRegs.filter(r => isEventPast(r.eventDate)).length;
  document.getElementById('s-total').textContent   = allRegs.length;
  document.getElementById('s-upcoming').textContent = upcoming;
  document.getElementById('s-past').textContent    = past;
  document.getElementById('total-count').textContent = allRegs.length + ' total registrations';
}

function renderTable() {
  const search    = document.getElementById('search-input').value.toLowerCase().trim();
  const evtFilter = document.getElementById('event-filter').value;
  const statusF   = document.getElementById('status-filter').value;
  let regs = [...allRegs];

  if (search)    regs = regs.filter(r => r.userFullName.toLowerCase().includes(search) || r.userEmail.toLowerCase().includes(search) || r.eventTitle.toLowerCase().includes(search));
  if (evtFilter) regs = regs.filter(r => r.eventTitle === evtFilter);
  if (statusF === 'upcoming') regs = regs.filter(r => !isEventPast(r.eventDate));
  if (statusF === 'past')     regs = regs.filter(r => isEventPast(r.eventDate));

  regs.sort((a,b) => new Date(b.registeredAt) - new Date(a.registeredAt));

  const tbody = document.getElementById('regs-tbody');
  const noRes = document.getElementById('no-results');

  if (regs.length === 0) {
    tbody.innerHTML = '';
    noRes.classList.remove('hidden');
    return;
  }
  noRes.classList.add('hidden');
  tbody.innerHTML = regs.map((r, i) => `
    <tr>
      <td style="color:var(--text-faint);font-size:0.78rem;">${i+1}</td>
      <td>
        <div style="display:flex;align-items:center;gap:8px;">
          <div class="avatar" style="width:30px;height:30px;font-size:0.75rem;">${r.userFullName.charAt(0).toUpperCase()}</div>
          <span style="font-weight:600;font-size:0.88rem;">${r.userFullName}</span>
        </div>
      </td>
      <td style="font-size:0.82rem;color:var(--text-muted);">${r.userEmail}</td>
      <td>
        <a href="../../pages/event-detail.html?id=${r.eventId}" style="font-weight:600;color:var(--primary-light);font-size:0.88rem;">${r.eventTitle}</a>
      </td>
      <td style="font-size:0.82rem;">
        <span class="${isEventPast(r.eventDate)?'':'tag tag-success'}" style="${isEventPast(r.eventDate)?'color:var(--text-faint);':''}">${formatDate(r.eventDate)}</span>
      </td>
      <td><span class="tag tag-accent">${r.eventCategory}</span></td>
      <td style="font-size:0.78rem;color:var(--text-faint);">${formatDate(r.registeredAt)}</td>
    </tr>`).join('');
}
</script>
</body>
</html>
