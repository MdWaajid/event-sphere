<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — EventSphere</title>
  <meta name="description" content="Login to your EventSphere account to register for events and manage your schedule."/>
  <link rel="stylesheet" href="../assets/css/styles.css"/>
</head>
<body>
<div class="auth-page">
  <div class="auth-card fade-in">
    <!-- Logo -->
    <div class="auth-logo">
      <div class="logo-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="4" r="1.6" fill="currentColor" stroke="none"/><circle cx="19.5" cy="16" r="1.6" fill="currentColor" stroke="none"/><circle cx="4.5" cy="16" r="1.6" fill="currentColor" stroke="none"/><path d="M12 8v-2.4M14.6 13.5l4.4 1.6M9.4 13.5l-4.4 1.6"/></svg></div>
      <span class="logo-text">EventSphere</span>
    </div>

    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-subtitle">Sign in to continue to EventSphere</p>

    <!-- Alert area -->
    <div id="alert-area"></div>

    <!-- Form -->
    <form id="login-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="you@example.com" required autocomplete="email"/>
        <div class="form-error" id="email-error">Please enter a valid email.</div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="input-wrapper">
          <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password"/>
          <button type="button" class="toggle-pw icon icon-sm" id="toggle-pw" title="Show/Hide password"><svg viewBox="0 0 24 24"><path d="M2 12s3.8-7 10-7 10 7 10 7-3.8 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
        <div class="form-error" id="password-error">Please enter your password.</div>
      </div>

      <button type="submit" class="btn btn-primary btn-full btn-lg" id="submit-btn" style="margin-top:8px;">
        Sign In
      </button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="register.html">Create one free</a>
    </div>

  </div>
</div>

<div id="toast-container" class="toast-container"></div>

<script src="../assets/js/icons.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  // Redirect if already logged in
  Auth.redirectIfLoggedIn();

  // Toggle password visibility
  const toggleBtn = document.getElementById('toggle-pw');
  const pwInput   = document.getElementById('password');
  toggleBtn.addEventListener('click', () => {
    const isText = pwInput.type === 'text';
    pwInput.type = isText ? 'password' : 'text';
    toggleBtn.innerHTML = isText ? ICONS.eye : ICONS.eyeOff;
  });

  // Form submit
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    clearErrors();

    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    let valid = true;
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      showFieldError('email', 'Please enter a valid email address.'); valid = false;
    }
    if (!password) {
      showFieldError('password', 'Please enter your password.'); valid = false;
    }
    if (!valid) return;

    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = 'Signing in…';

    try {
      const result = await API.login(email, password);
      if (result && result.error) {
        showAlert(result.error, 'danger');
      } else {
        toast('Welcome back, ' + result.user.fullName.split(' ')[0] + '!', 'success');
        setTimeout(() => {
          if (result.user.role === 'ADMIN') {
            window.location.href = 'admin/dashboard.html';
          } else {
            window.location.href = '../index.html';
          }
        }, 600);
      }
    } catch (err) {
      showAlert(err.message || 'Login failed. Please try again.', 'danger');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  });

  function showAlert(msg, type) {
    document.getElementById('alert-area').innerHTML =
      `<div class="alert alert-${type}"><span class="icon icon-sm">${type === 'danger' ? ICONS.xCircle : ICONS.checkCircle}</span><span>${msg}</span></div>`;
  }

  function showFieldError(field, msg) {
    document.getElementById(field).classList.add('error');
    const errEl = document.getElementById(field + '-error');
    if (errEl) { errEl.textContent = msg; errEl.style.display = 'block'; }
  }

  function clearErrors() {
    document.getElementById('alert-area').innerHTML = '';
    ['email','password'].forEach(f => {
      document.getElementById(f).classList.remove('error');
      const e = document.getElementById(f + '-error');
      if (e) e.style.display = 'none';
    });
  }
});
</script>
</body>
</html>
