<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Account — EventSphere</title>
  <meta name="description" content="Create a free EventSphere account to start registering for campus events."/>
  <link rel="stylesheet" href="../assets/css/styles.css"/>
</head>
<body>
<div class="auth-page">
  <div class="auth-card fade-in" style="max-width:480px;">
    <div class="auth-logo">
      <div class="logo-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="4" r="1.6" fill="currentColor" stroke="none"/><circle cx="19.5" cy="16" r="1.6" fill="currentColor" stroke="none"/><circle cx="4.5" cy="16" r="1.6" fill="currentColor" stroke="none"/><path d="M12 8v-2.4M14.6 13.5l4.4 1.6M9.4 13.5l-4.4 1.6"/></svg></div>
      <span class="logo-text">EventSphere</span>
    </div>

    <h1 class="auth-title">Create your account</h1>
    <p class="auth-subtitle">Join EventSphere — it's free, no payment required</p>

    <div id="alert-area"></div>

    <form id="register-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="fullName">Full Name</label>
        <input type="text" id="fullName" class="form-control" placeholder="John Doe" required autocomplete="name"/>
        <div class="form-error" id="fullName-error"></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="you@example.com" required autocomplete="email"/>
        <div class="form-error" id="email-error"></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="input-wrapper">
          <input type="password" id="password" class="form-control" placeholder="Min. 8 characters" required autocomplete="new-password"/>
          <button type="button" class="toggle-pw icon icon-sm" id="toggle-pw" title="Show/Hide"><svg viewBox="0 0 24 24"><path d="M2 12s3.8-7 10-7 10 7 10 7-3.8 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
        <div class="form-error" id="password-error"></div>
        <!-- Strength bar -->
        <div style="margin-top:8px;">
          <div style="height:4px;border-radius:99px;background:var(--border);overflow:hidden;">
            <div id="pw-strength-bar" style="height:100%;border-radius:99px;transition:all 0.3s;width:0%;"></div>
          </div>
          <div id="pw-strength-label" style="font-size:0.72rem;color:var(--text-faint);margin-top:4px;"></div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter password" required/>
        <div class="form-error" id="confirmPassword-error"></div>
      </div>

      <button type="submit" class="btn btn-primary btn-full btn-lg" id="submit-btn" style="margin-top:8px;">
        Create Account
      </button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="login.html">Sign in</a>
    </div>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>

<script src="../assets/js/icons.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  Auth.redirectIfLoggedIn('../index.html');

  // Toggle pw
  document.getElementById('toggle-pw').addEventListener('click', () => {
    const p = document.getElementById('password');
    p.type = p.type === 'text' ? 'password' : 'text';
    document.getElementById('toggle-pw').innerHTML = p.type === 'text' ? ICONS.eyeOff : ICONS.eye;
  });

  // Password strength
  document.getElementById('password').addEventListener('input', function() {
    const val = this.value;
    let strength = 0;
    if (val.length >= 8) strength++;
    if (/[A-Z]/.test(val)) strength++;
    if (/[0-9]/.test(val)) strength++;
    if (/[^A-Za-z0-9]/.test(val)) strength++;
    const bar   = document.getElementById('pw-strength-bar');
    const label = document.getElementById('pw-strength-label');
    const colors  = ['#ef4444','#f59e0b','#10b981','#7c3aed'];
    const labels  = ['Weak','Fair','Good','Strong'];
    bar.style.width  = (strength * 25) + '%';
    bar.style.background = colors[strength - 1] || '#ef4444';
    label.textContent = val ? labels[strength - 1] || 'Weak' : '';
  });

  // Submit
  document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    clearErrors();

    const fullName       = document.getElementById('fullName').value.trim();
    const email          = document.getElementById('email').value.trim();
    const password       = document.getElementById('password').value;
    const confirmPw      = document.getElementById('confirmPassword').value;
    let valid = true;

    if (!fullName || fullName.length < 2) {
      showFieldError('fullName', 'Full name must be at least 2 characters.'); valid = false;
    }
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      showFieldError('email', 'Please enter a valid email address.'); valid = false;
    }
    if (!password || password.length < 8) {
      showFieldError('password', 'Password must be at least 8 characters.'); valid = false;
    }
    if (password !== confirmPw) {
      showFieldError('confirmPassword', 'Passwords do not match.'); valid = false;
    }
    if (!valid) return;

    const btn = document.getElementById('submit-btn');
    btn.disabled = true; btn.textContent = 'Creating account…';

    try {
      const result = await API.register(fullName, email, password);
      if (result && result.error) {
        showAlert(result.error, 'danger');
      } else {
        toast('Account created! Welcome, ' + result.user.fullName.split(' ')[0] + '!', 'success');
        setTimeout(() => { window.location.href = '../index.html'; }, 700);
      }
    } catch (err) {
      showAlert(err.message || 'Registration failed. Please try again.', 'danger');
    } finally {
      btn.disabled = false; btn.textContent = 'Create Account';
    }
  });

  function showAlert(msg, type) {
    document.getElementById('alert-area').innerHTML =
      `<div class="alert alert-${type}"><span class="icon icon-sm">${type === 'danger' ? ICONS.xCircle : ICONS.checkCircle}</span><span>${msg}</span></div>`;
  }
  function showFieldError(field, msg) {
    document.getElementById(field).classList.add('error');
    const el = document.getElementById(field + '-error');
    if (el) { el.textContent = msg; el.style.display = 'block'; }
  }
  function clearErrors() {
    document.getElementById('alert-area').innerHTML = '';
    ['fullName','email','password','confirmPassword'].forEach(f => {
      document.getElementById(f).classList.remove('error');
      const el = document.getElementById(f + '-error');
      if (el) el.style.display = 'none';
    });
  }
});
</script>
</body>
</html>
