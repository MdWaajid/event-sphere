# ============================================================
# EventSphere — Application Configuration
# ============================================================

# Server
server.port=8080

# Lazily initialize beans — meaningfully cuts startup time on tiny/free-tier
# instances (0.1 CPU) at the cost of the very first request to each bean being
# slightly slower. Worthwhile tradeoff here since cold starts are the main pain point.
spring.main.lazy-initialization=true
server.servlet.context-path=/

# ============================================================
# Authentication (JWT — stateless)
# Frontend and backend live on different domains in production
# (Netlify + Render), where cross-site cookies are unreliable across
# browsers. JWT sent via "Authorization: Bearer <token>" avoids that
# entirely.
#
# IMPORTANT: set JWT_SECRET to a long random string in production
# (e.g. `openssl rand -base64 48`). The default below is fine for
# local dev only — never rely on it in a real deployment.
# ============================================================
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-eventsphere-training-project-not-for-production-use}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# ============================================================
# Database Configuration
# (Credentials loaded from environment variables — never hardcoded)
#
# For Supabase: use the "Connection Pooling" URI from
# Project Settings → Database, e.g.
#   jdbc:postgresql://aws-0-<region>.pooler.supabase.com:6543/postgres
# and set DB_USERNAME=postgres.<project-ref>, DB_PASSWORD=<your-password>
# ============================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/eventsphere_training_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000

# Supabase's "Transaction" pooler (port 6543, PgBouncer) doesn't support
# JDBC prepared-statement caching, so this is disabled by default.
# Harmless for a direct (non-pooled) connection too, so it's left enabled always.
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================================
# SQL Initialization (seed data)
# ============================================================
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=true

# ============================================================
# File Uploads (event images) — stored in Supabase Storage
# so they survive redeploys on platforms with ephemeral disks (e.g. Render Free)
#
# Get these from your Supabase project:
#   SUPABASE_URL             → Settings → API → Project URL
#   SUPABASE_SERVICE_ROLE_KEY→ Settings → API → service_role secret key
#   SUPABASE_STORAGE_BUCKET  → the Storage bucket name you create (must be Public)
# ============================================================
supabase.url=${SUPABASE_URL:}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.storage-bucket=${SUPABASE_STORAGE_BUCKET:event-images}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ============================================================
# Logging
# ============================================================
logging.level.com.eventsphere=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# ============================================================
# Jackson (JSON serialization)
# ============================================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null
