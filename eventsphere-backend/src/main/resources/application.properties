# ============================================================
# EventSphere — Application Configuration
# ============================================================

# Server
server.port=8080
server.servlet.context-path=/

# Session timeout (30 minutes of inactivity)
server.servlet.session.timeout=30m

# Cookie SameSite/Secure — needed when frontend and backend are on different
# domains (e.g. two separate Render services). Defaults are safe for local dev
# (same-origin, plain HTTP). In production, set COOKIE_SAME_SITE=none and
# COOKIE_SECURE=true as environment variables.
server.servlet.session.cookie.same-site=${COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# ============================================================
# Database Configuration
# (Credentials loaded from environment variables — never hardcoded)
#
# For Supabase: use the "Connection Pooling" URI from
# Project Settings → Database, e.g.
#   jdbc:postgresql://aws-0-<region>.pooler.supabase.com:6543/postgres
# and set DB_USERNAME=postgres.<project-ref>, DB_PASSWORD=<your-password>
# ============================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/eventsphere_training_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000

# Supabase's "Transaction" pooler (port 6543, PgBouncer) doesn't support
# JDBC prepared-statement caching. If you use that pooler URL, uncomment:
# spring.datasource.hikari.data-source-properties.prepareThreshold=0

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================================
# SQL Initialization (seed data)
# ============================================================
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=true

# ============================================================
# File Uploads (event images) — stored in Supabase Storage
# so they survive redeploys on platforms with ephemeral disks (e.g. Render Free)
#
# Get these from your Supabase project:
#   SUPABASE_URL             → Settings → API → Project URL
#   SUPABASE_SERVICE_ROLE_KEY→ Settings → API → service_role secret key
#   SUPABASE_STORAGE_BUCKET  → the Storage bucket name you create (must be Public)
# ============================================================
supabase.url=${SUPABASE_URL:}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.storage-bucket=${SUPABASE_STORAGE_BUCKET:event-images}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ============================================================
# Logging
# ============================================================
logging.level.com.eventsphere=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# ============================================================
# Jackson (JSON serialization)
# ============================================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null
