# ============================================================
# EventSphere — Application Configuration
# ============================================================

# ------------------------------------------------------------
# Server
# ------------------------------------------------------------
server.port=8080
server.servlet.context-path=/

# Session timeout (30 minutes of inactivity)
server.servlet.session.timeout=30m

# ============================================================
# Database Configuration
# (Credentials loaded from environment variables — never hardcoded)
# ============================================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------------------------------------
# Hikari Connection Pool
# ------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000

# ============================================================
# JPA / Hibernate
# ============================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================================
# SQL Initialization (seed data)
# ============================================================

spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=true

# ============================================================
# File Uploads (Supabase Storage)
# ============================================================

# Supabase Project URL
supabase.url=${SUPABASE_URL}

# Supabase Secret Key (server-side only)
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}

# Public bucket name
supabase.storage-bucket=${SUPABASE_STORAGE_BUCKET:event-images}

# Multipart upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ============================================================
# Logging
# ============================================================

logging.level.com.eventsphere=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# ============================================================
# Jackson (JSON serialization)
# ============================================================

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null